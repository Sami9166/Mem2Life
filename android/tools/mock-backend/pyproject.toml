[project]
name = "mem2life-mock-backend"
version = "0.1.0"
description = "android-dev가 업로드 API 계약(v1 초안)을 검증하기 위한 목업 백엔드. 실제 수신 서버는 wiki-builder가 Mem2Life/backend/에 별도로 구현한다."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_backend"]
