[project]
name = "mem2life-ingest"
version = "0.1.0"
description = "Meta Ray-Ban LLM Wiki — 기록(ingest) + 회상(recall) 파이프라인: 영상 → 오디오 추출 → STT(화자분리) → Obsidian md 생성 / 볼트 하이브리드 검색 → 답변 생성 → fallback 판정"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 110  # 한글 docstring/주석이 100자 근처에서 자주 넘어가 여유를 둠
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest", "recall"]

[project.scripts]
mem2life-ingest = "ingest.cli:main"
mem2life-recall = "recall.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
